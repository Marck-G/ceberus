[package]
name = "core_cerberus"
version = "0.1.0"
edition = "2021"

[lib]
name="core_cerberus"

[dependencies]
aes-gcm = "0.10.3"
base64 = { version = "0.22.1", features = ["std"] }
clap = { version = "4.5.40", features = ["derive"] }
openssl = { version = "0.10.73", features = ["vendored"] }
rand = "0.9.1"
ring = "0.17.14"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tracing = "0.1.41"
zstd = "0.13.3"