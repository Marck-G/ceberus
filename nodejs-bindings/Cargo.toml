[package]
name = "nodejs-bindings"
version = "0.1.0"
license = "ISC"
edition = "2021"
exclude = ["index.node"]

[lib]
crate-type = ["cdylib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
neon = { version = "1.1", features = ["sys", "serde"] }
core_cerberus = { path = "../core-cerberus" }
openssl = { version = "0.10.73", features = ["vendored"] }
tracing = "0.1.41"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
neon-serde = "0.4.0"
