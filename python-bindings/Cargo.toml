[package]
name = "pycerberus"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "pycerberus"


[dependencies]
core_cerberus = { path = "../core-cerberus" }
pyo3 = { version = "0.25.1", features = ["extension-module", "generate-import-lib", "serde"] }
openssl = { version = "0.10.73", features = ["vendored"] }
tracing = "0.1.41"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
